<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Easy Delivery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
    }

    header {
      background: #ff6a00;
      padding: 15px 5%;
      color: white;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .home {
      color: white;
      text-decoration: none;
    }

    .login-container {
      min-height: calc(100vh - 65px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #ff6a00;
    }

    .password-box {
      position: relative;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 13px;
      cursor: pointer;
      color: #666;
      font-size: 13px;
    }

    .forgot {
      display: block;
      text-align: right;
      margin: 12px 0;
      color: #ff6a00;
      text-decoration: none;
      font-size: 14px;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      background: #ff6a00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .login-btn:hover {
      background: #e85d00;
    }

    .register {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .register a {
      color: #ff6a00;
      text-decoration: none;
      font-weight: bold;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .login-box {
        padding: 22px;
      }

      .logo {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">🛍️ Easy Delivery</div>
    <a href="index.html" class="home">Home</a>
  </div>
</header>

<div class="login-container">

  <div class="login-box">

    <h1>Welcome Back 👋</h1>
    <p class="subtitle">Login to your Easy Delivery account</p>

    <form id="loginForm">

      <label for="email">Email or Phone</label>
      <input
        type="text"
        id="email"
        placeholder="Enter your email or phone"
        required
      >

      <label for="password">Password</label>

      <div class="password-box">
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >

        <span
          class="show-password"
          onclick="togglePassword()"
        >
          Show
        </span>
      </div>

      <a href="#" class="forgot" onclick="forgotPassword()">
        Forgot Password?
      </a>

      <button type="submit" class="login-btn">
        Login
      </button>

      <div id="message" class="message"></div>

    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

  </div>

</div>

<script>

  function togglePassword() {

    const password = document.getElementById("password");
    const button = document.querySelector(".show-password");

    if (password.type === "password") {
      password.type = "text";
      button.textContent = "Hide";
    } else {
      password.type = "password";
      button.textContent = "Show";
    }
  }


  function forgotPassword() {

    alert(
      "Password recovery will be available after the real backend authentication is connected."
    );
  }


  document
    .getElementById("loginForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const message = document.getElementById("message");

      if (!email || !password) {
        message.style.color = "red";
        message.textContent = "Please fill in all fields.";
        return;
      }

      /*
        Demo login only.

        Real login will later connect to:
        POST /api/auth/login
      */

      message.style.color = "green";
      message.textContent = "Login successful!";

      setTimeout(function() {
        window.location.href = "index.html";
      }, 1000);

    });

</script>

</body>
  </html>
