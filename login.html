<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Easy Delivery</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#ff6a00;color:white;padding:16px 6%;display:flex;justify-content:space-between}
.logo{font-size:25px;font-weight:bold}
header a{color:white;text-decoration:none;font-weight:bold}
.container{max-width:430px;margin:45px auto;padding:15px}
.box{background:white;padding:25px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{text-align:center;margin-bottom:20px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px}
button{width:100%;padding:13px;background:#ff6a00;color:white;border:0;border-radius:6px;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}
.register{text-align:center;margin-top:18px}
.register a{color:#ff6a00;font-weight:bold}
.demo{background:#fff3e8;padding:12px;border-radius:6px;margin-top:20px;font-size:13px}
</style>
</head>

<body>

<header>
  <div class="logo">🛍️ Easy Delivery</div>
  <a href="index.html">Home</a>
</header>

<div class="container">

<div class="box">

<h1>Login</h1>

<form id="loginForm">

<label>Email</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Enter your password" required>

<button type="submit">Login</button>

</form>

<div class="register">
Don't have an account?
<a href="register.html">Create Account</a>
</div>

<div class="demo">
<strong>Admin Demo Login</strong><br><br>
Email: admin@easydelivery.com<br>
Password: admin123
</div>

</div>

</div>

<script>

const adminEmail = "admin@easydelivery.com";
const adminPassword = "admin123";

document.getElementById("loginForm").addEventListener("submit", function(e){

  e.preventDefault();

  const email =
    document.getElementById("email").value.trim().toLowerCase();

  const password =
    document.getElementById("password").value;


  /* Admin Login */

  if(email === adminEmail && password === adminPassword){

    const admin = {
      name: "Easy Delivery Admin",
      email: adminEmail,
      role: "admin"
    };

    localStorage.setItem(
      "easyDeliveryCurrentUser",
      JSON.stringify(admin)
    );

    window.location.href = "admin.html";

    return;
  }


  /* Customer Login */

  const users = JSON.parse(
    localStorage.getItem("easyDeliveryUsers")
  ) || [];

  const user = users.find(
    u => u.email === email && u.password === password
  );


  if(!user){

    alert("Invalid email or password.");
    return;

  }


  localStorage.setItem(
    "easyDeliveryCurrentUser",
    JSON.stringify(user)
  );


  window.location.href = "index.html";

});

</script>

</body>
</html>
