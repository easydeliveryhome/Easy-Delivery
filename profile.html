<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account - Easy Delivery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #333;
    }

    header {
      background: #ff6a00;
      color: white;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .profile-header {
      background: white;
      border-radius: 12px;
      padding: 25px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ff6a00;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      font-weight: bold;
    }

    .profile-header h1 {
      margin-bottom: 7px;
    }

    .profile-header p {
      color: #777;
    }

    .layout {
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 20px;
    }

    .sidebar,
    .content-box {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .sidebar {
      padding: 10px;
      height: fit-content;
    }

    .sidebar button {
      width: 100%;
      border: none;
      background: white;
      padding: 13px;
      text-align: left;
      cursor: pointer;
      border-radius: 6px;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .sidebar button:hover,
    .sidebar button.active {
      background: #fff1e8;
      color: #ff6a00;
      font-weight: bold;
    }

    .sidebar .logout {
      color: #d62828;
    }

    .content-box {
      padding: 25px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #ff6a00;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .save-btn {
      margin-top: 18px;
      background: #ff6a00;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .save-btn:hover {
      background: #e85d00;
    }

    .order-card {
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .order-card h3 {
      color: #ff6a00;
      margin-bottom: 10px;
    }

    .order-card p {
      margin: 7px 0;
      color: #555;
    }

    .status {
      display: inline-block;
      background: #fff3cd;
      color: #856404;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    .shop-btn {
      display: inline-block;
      margin-top: 15px;
      background: #ff6a00;
      color: white;
      padding: 11px 18px;
      text-decoration: none;
      border-radius: 6px;
    }

    .info-card {
      background: #fafafa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .info-card p {
      margin: 8px 0;
    }

    .danger-btn {
      background: #d62828;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 700px) {

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: flex;
        overflow-x: auto;
        gap: 5px;
      }

      .sidebar button {
        min-width: 130px;
        white-space: nowrap;
      }

      .profile-header {
        flex-direction: column;
        text-align: center;
      }

    }
  </style>
</head>

<body>

<header>
  <div class="logo">🛍️ Easy Delivery</div>

  <div>
    <a href="index.html">Home</a>
    &nbsp;&nbsp;
    <a href="cart.html">Cart 🛒</a>
  </div>
</header>


<div class="container">

  <!-- Profile Header -->

  <div class="profile-header">

    <div class="avatar" id="avatar">
      U
    </div>

    <div>
      <h1 id="profileName">
        Easy Delivery Customer
      </h1>

      <p id="profileEmail">
        Welcome to your account
      </p>
    </div>

  </div>


  <div class="layout">

    <!-- Sidebar -->

    <div class="sidebar">

      <button
        class="active"
        onclick="showSection('personal', this)"
      >
        👤 Personal Information
      </button>

      <button
        onclick="showSection('orders', this)"
      >
        📦 My Orders
      </button>

      <button
        onclick="showSection('address', this)"
      >
        📍 My Address
      </button>

      <button
        onclick="showSection('security', this)"
      >
        🔒 Security
      </button>

      <button
        class="logout"
        onclick="logout()"
      >
        🚪 Logout
      </button>

    </div>


    <!-- Content -->

    <div class="content-box">


      <!-- Personal Information -->

      <div
        id="personal"
        class="section active"
      >

        <h2>Personal Information</h2>

        <form id="profileForm">

          <label>Full Name</label>

          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
          >


          <label>Email</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >


          <label>Phone Number</label>

          <input
            type="tel"
            id="phone"
            placeholder="01XXXXXXXXX"
          >


          <button
            type="submit"
            class="save-btn"
          >
            Save Changes
          </button>

        </form>

      </div>


      <!-- Orders -->

      <div
        id="orders"
        class="section"
      >

        <h2>My Orders</h2>

        <div id="ordersContainer"></div>

      </div>


      <!-- Address -->

      <div
        id="address"
        class="section"
      >

        <h2>My Address</h2>

        <form id="addressForm">

          <label>Full Name</label>

          <input
            type="text"
            id="addressName"
            placeholder="Enter your name"
          >


          <label>Phone Number</label>

          <input
            type="tel"
            id="addressPhone"
            placeholder="01XXXXXXXXX"
          >


          <label>Delivery Address</label>

          <textarea
            id="addressText"
            placeholder="House, Road, Area, District..."
          ></textarea>


          <label>Area</label>

          <input
            type="text"
            id="addressArea"
            placeholder="Your area"
          >


          <button
            type="submit"
            class="save-btn"
          >
            Save Address
          </button>

        </form>

      </div>


      <!-- Security -->

      <div
        id="security"
        class="section"
      >

        <h2>Security</h2>

        <div class="info-card">

          <p>
            🔐 Your account password is protected.
          </p>

          <p>
            For the demo version, password management
            is not connected to a real database yet.
          </p>

        </div>

        <button
          class="save-btn"
          onclick="changePassword()"
        >
          Change Password
        </button>

      </div>

    </div>

  </div>

</div>


<script>

  // Load saved profile

  const savedProfile =
    JSON.parse(
      localStorage.getItem("easyDeliveryProfile")
    ) || {};

  const savedAddress =
    JSON.parse(
      localStorage.getItem("easyDeliveryAddress")
    ) || {};


  // Default customer information

  const customer = {
    name: savedProfile.name || "Easy Delivery Customer",
    email: savedProfile.email || "customer@example.com",
    phone: savedProfile.phone || ""
  };


  // Show profile information

  document.getElementById("profileName").textContent =
    customer.name;

  document.getElementById("profileEmail").textContent =
    customer.email;

  document.getElementById("name").value =
    customer.name === "Easy Delivery Customer"
      ? ""
      : customer.name;

  document.getElementById("email").value =
    customer.email === "customer@example.com"
      ? ""
      : customer.email;

  document.getElementById("phone").value =
    customer.phone;


  // Avatar

  if (customer.name) {
    document.getElementById("avatar").textContent =
      customer.name.charAt(0).toUpperCase();
  }


  // Load address

  document.getElementById("addressName").value =
    savedAddress.name || "";

  document.getElementById("addressPhone").value =
    savedAddress.phone || "";

  document.getElementById("addressText").value =
    savedAddress.address || "";

  document.getElementById("addressArea").value =
    savedAddress.area || "";


  // Section switching

  function showSection(sectionId, button) {

    const sections =
      document.querySelectorAll(".section");

    sections.forEach(section => {
      section.classList.remove("active");
    });

    document
      .getElementById(sectionId)
      .classList.add("active");


    const buttons =
      document.querySelectorAll(".sidebar button");

    buttons.forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");


    if (sectionId === "orders") {
      loadOrders();
    }

  }
