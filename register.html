<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Easy Delivery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      min-height: 100vh;
    }

    header {
      background: #ff6a00;
      color: white;
      padding: 16px 5%;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .home {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 15px;
    }

    .register-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #ff6a00;
    }

    .password-box {
      position: relative;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 13px;
      cursor: pointer;
      color: #666;
      font-size: 14px;
    }

    .terms {
      margin: 18px 0;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 14px;
      color: #555;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    .terms a {
      color: #ff6a00;
      text-decoration: none;
    }

    .register-btn {
      width: 100%;
      padding: 14px;
      background: #ff6a00;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .register-btn:hover {
      background: #e85f00;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .login-text a {
      color: #ff6a00;
      font-weight: bold;
      text-decoration: none;
    }

    .message {
      display: none;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
      }

      .register-box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">🛍️ Easy Delivery</div>
    <a class="home" href="index.html">Home</a>
  </div>
</header>

<div class="container">

  <div class="register-box">

    <h1>Create Account</h1>

    <p class="subtitle">
      Join Easy Delivery today
    </p>

    <div id="message" class="message"></div>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
      >

      <label for="password">Password</label>

      <div class="password-box">
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          minlength="6"
          required
        >

        <span
          class="show-password"
          onclick="togglePassword('password')"
        >
          Show
        </span>
      </div>

      <label for="confirmPassword">Confirm Password</label>

      <div class="password-box">
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          minlength="6"
          required
        >

        <span
          class="show-password"
          onclick="togglePassword('confirmPassword')"
        >
          Show
        </span>
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>

        <span>
          I agree to the
          <a href="#">Terms & Conditions</a>
        </span>
      </div>

      <button class="register-btn" type="submit">
        Create Account
      </button>

    </form>

    <p class="login-text">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

</div>

<footer>
  © 2026 Easy Delivery. All rights reserved.
</footer>

<script>

  function togglePassword(id) {

    const input = document.getElementById(id);

    if (input.type === "password") {
      input.type = "text";
    } else {
      input.type = "password";
    }

  }


  document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

      event.preventDefault();

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message =
        document.getElementById("message");


      if (password.length < 6) {

        message.style.display = "block";
        message.style.background = "#ffe5e5";
        message.style.color = "#d00";
        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }


      if (password !== confirmPassword) {

        message.style.display = "block";
        message.style.background = "#ffe5e5";
        message.style.color = "#d00";
        message.textContent =
          "Passwords do not match.";

        return;
      }


      const user = {
        name: name,
        email: email,
        phone: phone
      };


      localStorage.setItem(
        "easyDeliveryUser",
        JSON.stringify(user)
      );


      message.style.display = "block";
      message.style.background = "#e5ffe9";
      message.style.color = "#087a20";
      message.textContent =
        "Account created successfully!";


      setTimeout(function() {
        window.location.href = "login.html";
      }, 1200);

    });

</script>

</body>
</html>
