<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Easy Delivery</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#ff6a00;color:white;padding:16px 6%;display:flex;justify-content:space-between}
.logo{font-size:25px;font-weight:bold}
header a{color:white;text-decoration:none;font-weight:bold}
.container{max-width:450px;margin:40px auto;padding:15px}
.box{background:white;padding:25px;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{text-align:center;margin-bottom:20px}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px}
button{width:100%;padding:13px;background:#ff6a00;color:white;border:0;border-radius:6px;font-size:16px;font-weight:bold;margin-top:20px}
.login{text-align:center;margin-top:18px}
.login a{color:#ff6a00;font-weight:bold}
.note{background:#fff3e8;padding:12px;border-radius:6px;margin-bottom:15px;font-size:14px}
</style>
</head>

<body>

<header>
  <div class="logo">🛍️ Easy Delivery</div>
  <a href="index.html">Home</a>
</header>

<div class="container">
<div class="box">

<h1>Create Account</h1>

<div class="note">
  Create your Easy Delivery customer account.
</div>

<form id="registerForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your name" required>

<label>Email</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Phone Number</label>
<input type="tel" id="phone" placeholder="01XXXXXXXXX" required>

<label>Password</label>
<input type="password" id="password" placeholder="Minimum 6 characters" required>

<label>Account Type</label>
<select id="role">
  <option value="customer">Customer</option>
</select>

<button type="submit">Create Account</button>

</form>

<div class="login">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>
</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(e){

  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;

  if(password.length < 6){
    alert("Password must be at least 6 characters.");
    return;
  }

  const users = JSON.parse(
    localStorage.getItem("easyDeliveryUsers")
  ) || [];

  const exists = users.find(user => user.email === email);

  if(exists){
    alert("This email is already registered.");
    return;
  }

  const user = {
    id: Date.now(),
    name: name,
    email: email,
    phone: phone,
    password: password,
    role: "customer"
  };

  users.push(user);

  localStorage.setItem(
    "easyDeliveryUsers",
    JSON.stringify(users)
  );

  alert("Account created successfully! ✅");

  window.location.href = "login.html";

});

</script>

</body>
</html>
