<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Easy Delivery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff6a00;
      color: white;
      padding: 15px 5%;
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 15px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .cart-box {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .cart-header,
    .cart-item {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 80px;
      gap: 15px;
      align-items: center;
      padding: 15px 20px;
    }

    .cart-header {
      background: #fff0e6;
      color: #333;
      font-weight: bold;
    }

    .cart-item {
      border-top: 1px solid #eee;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .product-info img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      font-size: 18px;
    }

    .remove {
      border: none;
      background: #ffe5e5;
      color: #d00;
      padding: 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .summary {
      max-width: 400px;
      margin: 25px 0 0 auto;
      background: white;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .total {
      border-top: 1px solid #ddd;
      padding-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #ff6a00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .clear {
      width: 100%;
      padding: 11px;
      border: 1px solid #ff6a00;
      border-radius: 6px;
      background: white;
      color: #ff6a00;
      cursor: pointer;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
    }

    .empty h2 {
      margin-bottom: 10px;
    }

    .shop {
      display: inline-block;
      margin-top: 20px;
      background: #ff6a00;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 30px;
      margin-top: 40px;
    }

    @media (max-width: 700px) {

      .cart-header {
        display: none;
      }

      .cart-item {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .product-info img {
        width: 80px;
        height: 80px;
      }

      .summary {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">🛍️ Easy Delivery</div>
    <a href="index.html">← Continue Shopping</a>
  </div>
</header>

<div class="container">

  <h1>🛒 My Cart</h1>

  <div id="cartArea"></div>

</div>

<footer>
  <h3>🛍️ Easy Delivery</h3>
  <p>Easy shopping. Fast delivery. Happy customers.</p>
  <p>© 2026 Easy Delivery</p>
</footer>

<script>

  const DELIVERY_FEE = 60;

  function getCart() {
    return JSON.parse(
      localStorage.getItem("easyDeliveryCart")
    ) || [];
  }

  function saveCart(cart) {
    localStorage.setItem(
      "easyDeliveryCart",
      JSON.stringify(cart)
    );
  }

  function renderCart() {

    const cart = getCart();
    const area = document.getElementById("cartArea");

    if (cart.length === 0) {

      area.innerHTML = `
        <div class="cart-box">
          <div class="empty">
            <h2>Your cart is empty 🛒</h2>
            <p>Add some products to your cart.</p>
            <a class="shop" href="index.html">
              Start Shopping
            </a>
          </div>
        </div>
      `;

      return;
    }

    let subtotal = 0;

    let itemsHTML = `
      <div class="cart-box">

        <div class="cart-header">
          <div>Product</div>
          <div>Price</div>
          <div>Quantity</div>
          <div>Total</div>
          <div>Action</div>
        </div>
    `;

    cart.forEach((item, index) => {

      const itemTotal =
        Number(item.price) * Number(item.quantity);

      subtotal += itemTotal;

      itemsHTML += `
        <div class="cart-item">

          <div class="product-info">

            <img
              src="${item.image || 'https://via.placeholder.com/80'}"
              alt="${item.name}"
            >

            <strong>${item.name}</strong>

          </div>

          <div>
            ৳${Number(item.price).toLocaleString()}
          </div>

          <div class="quantity">

            <button onclick="decrease(${index})">
              −
            </button>

            <span>${item.quantity}</span>

            <button onclick="increase(${index})">
              +
            </button>

          </div>

          <div>
            <strong>
              ৳${itemTotal.toLocaleString()}
            </strong>
          </div>

          <div>
            <button
              class="remove"
              onclick="removeItem(${index})">
              Remove
            </button>
          </div>

        </div>
      `;
    });

    itemsHTML += `</div>`;

    const grandTotal = subtotal + DELIVERY_FEE;

    itemsHTML += `
      <div class="summary">

        <div class="summary-row">
          <span>Subtotal</span>
          <strong>৳${subtotal.toLocaleString()}</strong>
        </div>

        <div class="summary-row">
          <span>Delivery Fee</span>
          <strong>৳${DELIVERY_FEE}</strong>
        </div>

        <div class="summary-row total">
          <span>Total</span>
          <span>৳${grandTotal.toLocaleString()}</span>
        </div>

        <button
          class="checkout"
          onclick="goCheckout()">
          Proceed to Checkout
        </button>

        <button
          class="clear"
          onclick="clearCart()">
          Clear Cart
        </button>

      </div>
    `;

    area.innerHTML = itemsHTML;
  }


  function increase(index) {

    const cart = getCart();

    cart[index].quantity++;

    saveCart(cart);

    renderCart();
  }


  function decrease(index) {

    const cart = getCart();

    if (cart[index].quantity > 1) {
      cart[index].quantity--;
    }

    saveCart(cart);

    renderCart();
  }


  function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    renderCart();
  }


  function clearCart() {

    if (confirm("Are you sure you want to clear your cart?")) {

      localStorage.removeItem("easyDeliveryCart");

      renderCart();
    }
  }


  function goCheckout() {

    const cart = getCart();

    if (cart.length === 0) {
      alert("Your cart is empty.");
      return;
    }

    window.location.href = "checkout.html";
  }


  renderCart();

</script>

</body>
</html>
