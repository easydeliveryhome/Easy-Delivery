<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart - Easy Delivery</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

/* HEADER */

header{
  background:#ff6a00;
  color:white;
  padding:15px 6%;
}

.navbar{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:25px;
  flex-wrap:wrap;
}

.logo{
  font-size:25px;
  font-weight:bold;
  white-space:nowrap;
}

nav{
  display:flex;
  gap:18px;
  margin-left:auto;
  align-items:center;
}

nav a,
nav button{
  color:white;
  text-decoration:none;
  font-weight:bold;
  background:none;
  border:none;
  cursor:pointer;
  font-size:15px;
}

/* CONTAINER */

.container{
  max-width:1100px;
  margin:30px auto;
  padding:15px;
}

h1{
  margin-bottom:20px;
}

/* CART */

.cart-box{
  background:white;
  border-radius:10px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.cart-item{
  display:grid;
  grid-template-columns:90px 1fr 120px 150px 80px;
  gap:15px;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.cart-item img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:7px;
}

.product-name{
  font-weight:bold;
}

.product-price{
  color:#ff6a00;
  font-weight:bold;
}

/* QUANTITY */

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
}

.quantity button{
  width:32px;
  height:32px;
  border:1px solid #ddd;
  background:white;
  cursor:pointer;
  font-size:18px;
}

.quantity span{
  min-width:25px;
  text-align:center;
  font-weight:bold;
}

/* REMOVE */

.remove-btn{
  background:#ff3b30;
  color:white;
  border:none;
  padding:8px 10px;
  border-radius:5px;
  cursor:pointer;
}

/* SUMMARY */

.summary{
  margin-top:25px;
  margin-left:auto;
  max-width:350px;
  background:#fff7f0;
  padding:20px;
  border-radius:8px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}

.grand-total{
  border-top:1px solid #ddd;
  padding-top:12px;
  font-size:20px;
  font-weight:bold;
  color:#ff6a00;
}

.checkout-btn{
  width:100%;
  padding:13px;
  margin-top:15px;
  border:none;
  border-radius:6px;
  background:#ff6a00;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.clear-btn{
  background:#222;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:5px;
  cursor:pointer;
  margin-bottom:15px;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
}

.empty h2{
  margin-bottom:10px;
}

.shop-btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 20px;
  background:#ff6a00;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

/* LOGIN */

.login-box{
  background:white;
  padding:40px 20px;
  text-align:center;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.login-box h2{
  margin-bottom:10px;
}

.login-btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  background:#ff6a00;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-weight:bold;
}

/* FOOTER */

footer{
  margin-top:40px;
  background:#222;
  color:white;
  text-align:center;
  padding:20px;
}

/* MOBILE */

@media(max-width:750px){

  .cart-item{
    grid-template-columns:70px 1fr;
    gap:10px;
  }

  .cart-item img{
    width:65px;
    height:65px;
  }

  .quantity,
  .product-price,
  .remove-btn{
    grid-column:2;
  }

  nav{
    width:100%;
    justify-content:center;
    margin-left:0;
  }

}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="navbar">

    <div class="logo">
      🛍️ Easy Delivery
    </div>

    <nav>

      <a href="index.html">Home</a>

      <a href="product.html">Products</a>

      <a href="cart.html">🛒 Cart</a>

      <a id="accountLink" href="login.html">
        Login
      </a>

      <button
        id="logoutBtn"
        onclick="logout()"
        style="display:none;"
      >
        Logout
      </button>

    </nav>

  </div>

</header>


<!-- MAIN -->

<div class="container">

  <h1>🛒 Your Cart</h1>

  <div id="cartArea"></div>

</div>


<!-- FOOTER -->

<footer>

  <p>
    © 2026 Easy Delivery. All Rights Reserved.
  </p>

</footer>


<script>

/* =========================
   CUSTOMER LOGIN CHECK
========================= */

const currentUser = JSON.parse(
  localStorage.getItem("easyDeliveryCurrentUser")
);

const accountLink =
  document.getElementById("accountLink");

const logoutBtn =
  document.getElementById("logoutBtn");


if(
  currentUser &&
  currentUser.role === "customer"
){

  accountLink.textContent = "My Account";
  accountLink.href = "profile.html";

  logoutBtn.style.display = "block";

}else{

  accountLink.textContent = "Login";
  accountLink.href = "login.html";

}


/* =========================
   LOGIN PROTECTION
========================= */

if(
  !currentUser ||
  currentUser.role !== "customer"
){

  document.getElementById("cartArea").innerHTML = `

    <div class="login-box">

      <h2>Please Login First 🔐</h2>

      <p>
        You need a customer account to use the shopping cart.
      </p>

      <a class="login-btn" href="login.html">
        Login
      </a>

    </div>

  `;

}else{

  loadCart();

}


/* =========================
   LOAD CART
========================= */

function loadCart(){

  const cart =
    JSON.parse(
      localStorage.getItem("easyDeliveryCart")
    ) || [];

  const cartArea =
    document.getElementById("cartArea");


  /* EMPTY CART */

  if(cart.length === 0){

    cartArea.innerHTML = `

      <div class="login-box">

        <div class="empty">

          <h2>Your Cart is Empty 🛒</h2>

          <p>
            You haven't added any products yet.
          </p>

          <a
            class="shop-btn"
            href="index.html"
          >
            Continue Shopping
          </a>

        </div>

      </div>

    `;

    return;
  }


  let subtotal = 0;

  let itemsHTML = "";


  cart.forEach(function(item,index){

    const itemTotal =
      item.price * item.quantity;

    subtotal += itemTotal;


    itemsHTML += `

      <div class="cart-item">

        <img
          src="${item.image}"
          alt="${item.name}"
        >

        <div>

          <div class="product-name">
            ${item.name}
          </div>

          <div class="product-price">
            ৳${item.price}
          </div>

        </div>


        <div class="quantity">

          <button
            onclick="decreaseQuantity(${index})"
          >
            −
          </button>

          <span>
            ${item.quantity}
          </span>

          <button
            onclick="increaseQuantity(${index})"
          >
            +
          </button>

        </div>


        <div class="product-price">
          ৳${itemTotal}
        </div>


        <button
          class="remove-btn"
          onclick="removeItem(${index})"
        >
          Remove
        </button>

      </div>

    `;

  });


  const deliveryFee = 60;

  const grandTotal =
    subtotal + deliveryFee;


  cartArea.innerHTML = `

    <div class="cart-box">

      <button
        class="clear-btn"
        onclick="clearCart()"
      >
        Clear Cart
      </button>

      ${itemsHTML}

      <div class="summary">

        <div class="summary-row">

          <span>Subtotal</span>

          <span>
            ৳${subtotal}
          </span>

        </div>


        <div class="summary-row">

          <span>Delivery Fee</span>

          <span>
            ৳${deliveryFee}
          </span>

        </div>


        <div class="summary-row grand-total">

          <span>Total</span>

          <span>
            ৳${grandTotal}
          </span>

        </div>


        <button
          class="checkout-btn"
          onclick="goToCheckout()"
        >
          Proceed to Checkout
        </button>

      </div>

    </div>

  `;

}


/* =========================
   INCREASE
========================= */

function increaseQuantity(index){

  let cart =
    JSON.parse(
      localStorage.getItem("easyDeliveryCart")
    ) || [];

  cart[index].quantity++;

  localStorage.setItem(
    "easyDeliveryCart",
    JSON.stringify(cart)
  );

  loadCart();

}


/* =========================
   DECREASE
========================= */

function decreaseQuantity(index){

  let cart =
    JSON.parse(
      localStorage.getItem("easyDeliveryCart")
    ) || [];

  if(cart[index].quantity > 1){

    cart[index].quantity--;

  }

  localStorage.setItem(
    "easyDeliveryCart",
    JSON.stringify(cart)
  );

  loadCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

  let cart =
    JSON.parse(
      localStorage.getItem("easyDeliveryCart")
    ) || [];

  cart.splice(index,1);

  localStorage.setItem(
    "easyDeliveryCart",
    JSON.stringify(cart)
  );

  loadCart();

}


/* =========================
   CLEAR CART
========================= */

function clearCart(){

  if(
    !confirm(
      "Are you sure you want to clear your cart?"
    )
  ){

    return;

  }

  localStorage.removeItem(
    "easyDeliveryCart"
  );

  loadCart();

}


/* =========================
   CHECKOUT
========================= */

function goToCheckout(){

  const cart =
    JSON.parse(
      localStorage.getItem("easyDeliveryCart")
    ) || [];


  if(cart.length === 0){

    alert("Your cart is empty.");

    return;

  }


  window.location.href =
    "checkout.html";

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "easyDeliveryCurrentUser"
  );

  localStorage.removeItem(
    "easyDeliveryCart"
  );

  alert("You have been logged out.");

  window.location.href =
    "login.html";

}

</script>

</body>
  </html>
