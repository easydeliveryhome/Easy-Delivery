<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel - Easy Delivery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #333;
    }

    header {
      height: 65px;
      background: #ff6a00;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .home-link {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .layout {
      display: flex;
      min-height: calc(100vh - 65px);
    }

    /* Sidebar */

    .sidebar {
      width: 230px;
      background: #222;
      color: white;
      padding: 20px 12px;
      flex-shrink: 0;
    }

    .sidebar h3 {
      padding: 10px;
      margin-bottom: 10px;
      color: #ff8a3d;
    }

    .menu-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: white;
      padding: 13px 12px;
      text-align: left;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .menu-btn:hover,
    .menu-btn.active {
      background: #ff6a00;
    }

    .logout {
      margin-top: 20px;
      color: #ff7777;
    }

    /* Main */

    .main {
      flex: 1;
      padding: 25px;
      overflow-x: auto;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section-title {
      margin-bottom: 20px;
    }

    /* Dashboard cards */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }

    .stat-card p {
      color: #777;
      margin-bottom: 10px;
    }

    .stat-card h2 {
      color: #ff6a00;
    }

    /* Box */

    .box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-bottom: 20px;
    }

    .box h2 {
      margin-bottom: 18px;
    }

    /* Table */

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #fff3eb;
      color: #444;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      background: #fff3cd;
      color: #856404;
      font-size: 13px;
      font-weight: bold;
    }

    .action-btn {
      border: none;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      margin: 2px;
    }

    .edit {
      background: #e8f1ff;
      color: #1769aa;
    }
